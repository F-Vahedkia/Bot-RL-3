# Commission profiles are intentionally kept outside the main config.yaml.
#
# IMPORTANT:
# - active_broker=default preserves the existing global simulation commission.
# - Vendor schedules below are examples only and remain unverified/inactive.
# - Verify the exact account type, symbol coverage, commission currency and
#   whether the published fee is per side or round-turn before selecting them.
# - strict_symbols prevents a missing instrument schedule from silently using
#   a potentially incorrect fee schedule.

transaction_costs:
  simulation:
    commission_profiles:
      active_broker: default
      active_account_type: default

      brokers:
        alpari:
