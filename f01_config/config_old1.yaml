    enabled: true
    symbols:
      XAUUSD: [
        minute, hour, day_of_week, day_of_month, day_of_year, week_of_year, month, quarter,
        session_asia, session_london, session_newyork,
        is_weekend, is_month_start, is_month_end, is_quarter_start, is_quarter_end,
        sin_hour, cos_hour, sin_day_of_week, cos_day_of_week, sin_month, cos_month,
        market_open_flag, market_close_flag, is_new_day,
       ]
