version: 1.0.0
# === 1 =============================================================
project:
  name: Bot-RL-3
  broker_timezone: "Europe/Athens"
  base_currency: USD
  random_seed: 42
  enable_env_override: true
  
# === 2 ============================================================= complete
config_layers:
  extends:
  - f01_config/extend_config.yaml      # کمترین اهمیت- کمتر از همین فایل کانفیگ 
  # - f01_config/extend_config_2.yaml  # اهمیتش از بالایی بیشتر است 
  bases:
  - f01_config/base_config.yaml        #اهمیت این فایل بیشتراز extendsهااست.
                                      # اماازهمین فایل کانفیگ(config.yaml) و از overlaysها کمتر است 
  # - f01_config/base_config_2.yaml    # اهمیت این فایل از بالایی ها بیشتر است 
  # (==> THIS CONFIG FILE)
  overlays:
  - f01_config/symbol_specs.yaml       # بیشترین اهمیت- بیش از حتی همین فایل کانفیگ(config.yaml) 
  # - f01_config/symbol_specs_22.yaml
  # - f01_config/symbol_specs_33.yaml

# === 3 ============================================================= comptlete
# ----- Used: main.py
logging:
  level: DEBUG          # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s | %(levelname)-6s | %(filename)-28s | %(lineno)-4d : %(funcName)-24s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  file_enabled: true
  file: "f00_logs/Bot-RL-3.log"

# === 4 ============================================================= 
paths:
  root_dir: .
  config_versions_dir: f01_config/versions  ####
  
  data_dir:      f03_data
  raw_dir:       f03_data/raw
  processed_dir: f03_data/processed
  news_dir:      f03_data/news
  cache_dir:     f03_data/cache  ####

  feature_dir: f04_features/features_dfs

  models_dir: f13_models  ####
  models:
    production_dir:  f13_models/production
    staging_dir:     f13_models/staging
    checkpoints_dir: f13_models/checkpoints
    experiments_dir: f13_models/experiments
  
  logs_dir:    _logs  ####
  reports_dir: _reports  ####
  tmp_dir:     _tmp   ####

# === 5 ============================================================= comptlete
connection:   # ----- Used in: mt5_connector.py
  mt5_credentials:   # ----- Used in: mt5_connector.py / _read_credentials_from_config()
    login: 00000000
    password: Password
    server: Server
    terminal_path: "C:/Program Files/Alpari MT5/terminal64.exe"

  initialize_retry:   # ----- Used in: mt5_connector.py / _read_options_from_config()
    max_retries: 5  # int
    retry_delay: 5.0  # float
    backoff_multiplier: 1.0  # float
    auto_select_symbols: True  # bool
    check_trade_allowed: False  # bool
    symbol_activation_timeout: 0.0  # float
    ensure_on_each_call: True  # bool

# === 6 ============================================================= new
download_defaults:   # ----- Used in: mt5_data_loader.py / class MT5DataLoader / __init__()
  auto_download: true
  symbols:   # ----- Used in: mt5_connector.py / _auto_select_symbols()
  # - XAUUSD
  # - EURUSD
  - BITCOIN
  # - XAGUSD
  # - GBPUSD
  # - USDJPY
  # - USDCHF
  # - USDCAD
  # - AUDUSD
  # - NZDUSD
  timeframes:
  - M1
  # - M2
  # - M4
  # - M5
  # - M10
  # - M20
  # - M30
  # - H1
  # - H4
  # - D1
  # - W1
  # ----- below 4 keys, used in: mt5_data_loader/class DownloadPlan
  lookback_bars: 20000              # در صورتیکه صفر یا منفی باشد، به حساب نمی آید 
  broker_date_from: 2026-09-16 00:00:00+03:00  # در صورتیکه هر دو برابر باشند یا date_from بیشتر باشد به حساب نمی آیند 
  broker_date_to:   2026-09-16 21:59:00+03:00  # مقدار date_to میتواند NOW یا now هم اختیار کند 
  result_timezone: "UTC"
  range_policy: count                    # میتواند یکی از رشته مقادیر min, max, date, count را داشته باشد 

  batch_size: 50                                   # NOT USED
  save_format: csv   # can be: csv | parquet   # Used many times in different files
  # save_at_utc_time: true    (بهتر است حذف بشود)   # Used in: mt5_data_loader/class MT5DataLoader_batch/__init__()

